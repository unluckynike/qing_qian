services:
  db:
    # pgvector/pgvector:pg16 = 官方 postgres:16 镜像 + 预装 pgvector 向量扩展(数据卷兼容)
    image: pgvector/pgvector:pg16
    container_name: qingqian-db
    environment:
      POSTGRES_DB: qingqian
      POSTGRES_USER: qingqian
      POSTGRES_PASSWORD: qingqian_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qingqian -d qingqian"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
